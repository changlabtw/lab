name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 部署到 Pages 需要這三個權限;contents 只要讀得到就好
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署,但不取消進行中的 —— 中途取消會留下半套的站台
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
